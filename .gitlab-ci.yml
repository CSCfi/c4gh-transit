stages:
  - lint
  - test
  - build
  - release

include:
  - project: 'sds-dev/releases'
    ref: main
    file: 'releases.yml'

workflow:
  auto_cancel:
    on_new_commit: interruptible

.go-cache:
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.go-build

lint:
  stage: lint
  extends: .go-cache
  variables:
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.cache
  rules:
    # We don't run on tags and default branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: '$CI_COMMIT_TAG !~ "/^$/"'
      when: never
  tags:
    - sds
  script:
    - mkdir -p .cache
    - golangci-lint run -v ./... --timeout 10m --output.code-climate.path stdout | tee gl-code-quality-report.json
    - go fmt ./...
    - go vet ./...
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - gl-code-quality-report.json
  after_script:
    - sudo rm -rf .go/pkg

jfrog-go-audit:
  stage: test
  rules:
    # We don't run on tags and default branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: '$CI_COMMIT_TAG !~ "/^$/"'
      when: never
  tags:
    - sds
  before_script:
    # Configure JFrog Artifactory repositories
    - jf config import "${JF_CONFIG}"
  script:
    # Audit Go project
    - jf audit --go --licenses --extended-table --min-severity=Medium

test:
  stage: test
  rules:
    # We don't run on tags and default branch
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
      interruptible: true
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: '$CI_COMMIT_TAG !~ "/^$/"'
      when: never
  tags:
    - sds
  resource_group: testing
  before_script:
    - docker stop $(docker ps -q --filter "name=test-C4ghTransit") 2>/dev/null || true
  script:
    - export ARTIFACTORY_USER=$ARTIFACTORY_USER
    - export ARTIFACTORY_USER_PASSWORD=$ARTIFACTORY_USER_PASSWORD
    - export ARTIFACTORY_SERVER=$ARTIFACTORY_SERVER
    - go test -timeout 40m -v ./c4ghtransit

build-binary:
  stage: build
  tags:
    - sds
  rules:
    - if: '$CI_COMMIT_TAG !~ "/^$/"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
  before_script:
    - mkdir -p output
    # Configure JFrog Artifactory repositories
    - jf config import "${JF_CONFIG}"
  script:
    # GOARCH is defined explicitly so that it works in arm64 as well
    - CGO_ENABLED=0 GOARCH=amd64 go build -tags netgo -a -v -o output/c4ghtransit c4ghtransit/cmd/c4ghtransit/main.go
    # Scan binary
    - jf s --licenses output/c4ghtransit --repo ${ARTIFACTORY_BINARY_REPO}
    # Push binary
    - echo Pushing "${CI_COMMIT_TAG}" plugin build
    - jf rt u output/c4ghtransit $ARTIFACTORY_BINARY_REPO/$CI_PROJECT_NAME/c4ghtransit-${CI_COMMIT_TAG}
  after_script:
    - echo "BINARY_JOB_ID=$CI_JOB_ID" >> binary_job_id.env
  artifacts:
    expose_as: 'c4ghtransit'
    paths:
      - output/c4ghtransit
    expire_in: never
    reports:
      dotenv: binary_job_id.env

# This job requires that you have deleted c4ghtransit-fixed from Artifactory.
# The created binary has such a niche use case that it seemed better to have it
# be manually updated and not have proper release tags
build-fixed-binary:
  stage: build
  tags:
    - sds
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: manual
      allow_failure: true
  before_script:
    - mkdir -p output
    - jf config import "${JF_CONFIG}"
  script:
    - |
      cp dev-tools/mock_entropy.go.txt c4ghtransit/mock_entropy.go
      go mod tidy

      CGO_ENABLED=0 GOARCH=amd64 go build -tags netgo -a -v -o output/c4ghtransit-fixed c4ghtransit/cmd/c4ghtransit/main.go
      jf s --licenses output/c4ghtransit-fixed --repo ${ARTIFACTORY_BINARY_REPO}

      echo Pushing latest plugin build with fixed public keys
      jf rt u output/c4ghtransit-fixed "$ARTIFACTORY_BINARY_REPO/$CI_PROJECT_NAME/c4ghtransit-fixed"
  after_script:
    - rm -f c4ghtransit/mock_entropy.go

build-openapi:
  stage: build
  image:
    name: docker.io/hashicorp/vault:1.21
    entrypoint: [""]
  tags:
    - docker-exec
  rules:
    - if: '$CI_COMMIT_TAG !~ "/^$/"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
  needs:
    - job: build-binary
      artifacts: true
  before_script:
    - apk add bash jq git wget curl
    - mkdir -p vault/plugins
    - mv output/c4ghtransit vault/plugins
    - bash dev-tools/vault.sh &
  script:
    - sleep 5
    - bash dev-tools/generate_openapi.sh
  after_script:
    - echo "OPENAPI_JOB_ID=$CI_JOB_ID" >> openapi_job_id.env
  artifacts:
    expose_as: 'c4ghtransit-openapi-schema'
    paths:
      - dev-tools/openapi.json
    expire_in: never
    reports:
      dotenv: openapi_job_id.env


release:
  extends: .automated-release
  release:
    description: $(cat release_changes.md)
    assets:
      links:
        - name: c4ghtransit-${RELEASE_VERSION} (artifactory)
          url: $ARTIFACTORY_URL/artifactory/$ARTIFACTORY_BINARY_REPO/$CI_PROJECT_NAME/c4ghtransit-${RELEASE_VERSION}
